<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B0F17"/>
      <stop offset="100%" stop-color="#111827"/>
    </linearGradient>
    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="100%" stop-color="#0284C7"/>
    </linearGradient>
    <linearGradient id="emeraldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34D399"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
    <linearGradient id="purpleGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#C084FC"/>
      <stop offset="100%" stop-color="#7C3AED"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Frame Background -->
  <rect width="800" height="450" rx="14" fill="url(#bgGrad)" stroke="#1E293B" stroke-width="2"/>

  <!-- Window Header -->
  <rect width="800" height="42" rx="14" fill="#0F172A"/>
  <rect y="28" width="800" height="14" fill="#0F172A"/>
  <line x1="0" y1="42" x2="800" y2="42" stroke="#1E293B" stroke-width="1.5"/>

  <!-- Window Dots -->
  <circle cx="24" cy="21" r="5.5" fill="#EF4444"/>
  <circle cx="42" cy="21" r="5.5" fill="#F59E0B"/>
  <circle cx="60" cy="21" r="5.5" fill="#10B981"/>

  <!-- Address Bar -->
  <rect x="180" y="9" width="440" height="24" rx="6" fill="#1E293B" stroke="#334155" stroke-width="1"/>
  <text x="400" y="25" fill="#94A3B8" font-family="'JetBrains Mono', monospace" font-size="11" text-anchor="middle">
    🔒 https://borala.ufs.br/credenciamento/scanner
  </text>

  <!-- Tag Title on Right -->
  <text x="770" y="25" fill="#38BDF8" font-family="'Inter', sans-serif" font-weight="600" font-size="11" text-anchor="end">
    BoraLá • Credenciamento & QR Code LGPD
  </text>

  <!-- Body Content -->
  <g transform="translate(0, 42)">
    
    <rect width="800" height="408" fill="#0B0F17"/>

    <g transform="translate(40, 20)">
      <text x="0" y="20" fill="#F8FAFC" font-family="'Inter', sans-serif" font-weight="700" font-size="17">Módulo de Credenciamento Rápido & Crachás Seguros</text>
      <text x="0" y="38" fill="#94A3B8" font-family="'Inter', sans-serif" font-size="12">Emissão de Crachá com QR Code criptografado (conformidade LGPD - sem exposição de CPF)</text>

      <!-- Left Column: Crachá Preview -->
      <rect x="0" y="55" width="310" height="305" rx="10" fill="#111827" stroke="#1E293B" stroke-width="1"/>
      
      <!-- Crachá card -->
      <rect x="35" y="80" width="240" height="255" rx="10" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1"/>
      <rect x="35" y="80" width="240" height="12" rx="4" fill="#7C3AED"/>
      <text x="155" y="112" fill="#0F172A" font-family="'Inter', sans-serif" font-weight="800" font-size="12" text-anchor="middle">BORALÁ • UFS ITATECH</text>
      
      <!-- Mock Avatar -->
      <circle cx="155" cy="150" r="28" fill="#0284C7"/>
      <text x="155" y="157" fill="#FFFFFF" font-family="'Inter', sans-serif" font-weight="700" font-size="16" text-anchor="middle">CM</text>

      <text x="155" y="196" fill="#0F172A" font-family="'Inter', sans-serif" font-weight="800" font-size="14" text-anchor="middle">Cassiano Menezes</text>
      <text x="155" y="212" fill="#7C3AED" font-family="'Inter', sans-serif" font-weight="700" font-size="10" text-anchor="middle">DESENVOLVEDOR / PARTICIPANTE</text>
      
      <!-- QR Code graphic -->
      <rect x="115" y="226" width="80" height="80" fill="#000000" rx="4"/>
      <rect x="123" y="234" width="24" height="24" fill="#FFFFFF"/>
      <rect x="127" y="238" width="16" height="16" fill="#000000"/>
      <rect x="163" y="234" width="24" height="24" fill="#FFFFFF"/>
      <rect x="167" y="238" width="16" height="16" fill="#000000"/>
      <rect x="123" y="274" width="24" height="24" fill="#FFFFFF"/>
      <rect x="127" y="278" width="16" height="16" fill="#000000"/>
      <rect x="157" y="274" width="30" height="30" fill="#FFFFFF"/>
      <rect x="163" y="280" width="10" height="10" fill="#000000"/>

      <text x="155" y="322" fill="#64748B" font-family="'JetBrains Mono', monospace" font-size="8" text-anchor="middle">TOKEN: 7f8a9e2c... (LGPD SAFE)</text>

      <!-- Right Column: Scanner in Realtime -->
      <rect x="340" y="55" width="380" height="305" rx="10" fill="#111827" stroke="#34D399" stroke-width="1.5"/>
      <text x="360" y="85" fill="#34D399" font-family="'Inter', sans-serif" font-weight="700" font-size="14">⚡ Credenciamento Instantâneo</text>
      <text x="360" y="103" fill="#94A3B8" font-family="'Inter', sans-serif" font-size="11">Câmera ativa via QRCoder • Leitura de crachás no auditório</text>

      <!-- Scanner Frame View -->
      <rect x="360" y="120" width="340" height="130" rx="8" fill="#090D16" stroke="#1E293B" stroke-width="1"/>
      <rect x="440" y="135" width="180" height="100" rx="6" fill="none" stroke="#34D399" stroke-width="2" stroke-dasharray="10,6"/>
      <line x1="430" y1="185" x2="630" y2="185" stroke="#34D399" stroke-width="2"/>
      <text x="530" y="215" fill="#34D399" font-family="'JetBrains Mono', monospace" font-size="11" text-anchor="middle">ALINHE O QR CODE</text>

      <!-- Confirmation Box -->
      <rect x="360" y="262" width="340" height="82" rx="8" fill="rgba(16, 185, 129, 0.12)" stroke="#10B981" stroke-width="1"/>
      <text x="375" y="285" fill="#34D399" font-family="'Inter', sans-serif" font-weight="700" font-size="13">✓ Presença Confirmada com Sucesso!</text>
      <text x="375" y="305" fill="#F8FAFC" font-family="'Inter', sans-serif" font-size="11">Participante: Cassiano Menezes • Inscrição #108</text>
      <text x="375" y="325" fill="#94A3B8" font-family="'JetBrains Mono', monospace" font-size="10">Entrada registrada: 13/11/2026 08:30:14 (Horário Oficial UFS)</text>
    </g>
    
  </g>
</svg>