<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B0F17"/>
      <stop offset="100%" stop-color="#111827"/>
    </linearGradient>
    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="100%" stop-color="#0284C7"/>
    </linearGradient>
    <linearGradient id="emeraldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34D399"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
    <linearGradient id="purpleGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#C084FC"/>
      <stop offset="100%" stop-color="#7C3AED"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Frame Background -->
  <rect width="800" height="450" rx="14" fill="url(#bgGrad)" stroke="#1E293B" stroke-width="2"/>

  <!-- Window Header -->
  <rect width="800" height="42" rx="14" fill="#0F172A"/>
  <rect y="28" width="800" height="14" fill="#0F172A"/>
  <line x1="0" y1="42" x2="800" y2="42" stroke="#1E293B" stroke-width="1.5"/>

  <!-- Window Dots -->
  <circle cx="24" cy="21" r="5.5" fill="#EF4444"/>
  <circle cx="42" cy="21" r="5.5" fill="#F59E0B"/>
  <circle cx="60" cy="21" r="5.5" fill="#10B981"/>

  <!-- Address Bar -->
  <rect x="180" y="9" width="440" height="24" rx="6" fill="#1E293B" stroke="#334155" stroke-width="1"/>
  <text x="400" y="25" fill="#94A3B8" font-family="'JetBrains Mono', monospace" font-size="11" text-anchor="middle">
    🔒 https://radarpecas.app/mapa-oficinas
  </text>

  <!-- Tag Title on Right -->
  <text x="770" y="25" fill="#38BDF8" font-family="'Inter', sans-serif" font-weight="600" font-size="11" text-anchor="end">
    RadarPeças • Mapa Geoespacial
  </text>

  <!-- Body Content -->
  <g transform="translate(0, 42)">
    
    <!-- Sidebar -->
    <rect x="0" y="0" width="220" height="408" fill="#0D131F" stroke="#1E293B" stroke-width="1"/>
    <text x="24" y="36" fill="#F8FAFC" font-family="'Inter', sans-serif" font-weight="700" font-size="15">RadarPeças</text>
    <rect x="24" y="52" width="172" height="34" rx="6" fill="#1E293B" stroke="#38BDF8" stroke-width="1"/>
    <text x="36" y="73" fill="#38BDF8" font-family="'Inter', sans-serif" font-size="12">🔍 Peça: Pastilha Freio</text>

    <!-- Filters -->
    <text x="24" y="112" fill="#94A3B8" font-family="'JetBrains Mono', monospace" font-size="11">RAIO DE BUSCA: 15 km</text>
    <rect x="24" y="124" width="172" height="6" rx="3" fill="#1E293B"/>
    <rect x="24" y="124" width="100" height="6" rx="3" fill="#38BDF8"/>
    <circle cx="124" cy="127" r="6" fill="#F8FAFC"/>

    <text x="24" y="160" fill="#94A3B8" font-family="'JetBrains Mono', monospace" font-size="11">MODELO MOTO:</text>
    <rect x="24" y="172" width="172" height="28" rx="6" fill="#162032" stroke="#334155" stroke-width="1"/>
    <text x="36" y="190" fill="#F8FAFC" font-family="'Inter', sans-serif" font-size="12">Honda CG 160 Titan</text>

    <!-- Results Cards in sidebar -->
    <text x="24" y="228" fill="#94A3B8" font-family="'JetBrains Mono', monospace" font-size="11">4 OFICINAS PRÓXIMAS</text>
    
    <rect x="24" y="242" width="172" height="68" rx="8" fill="#162032" stroke="#38BDF8" stroke-width="1.5"/>
    <text x="34" y="262" fill="#F8FAFC" font-family="'Inter', sans-serif" font-weight="600" font-size="12">Moto Peças Central</text>
    <text x="34" y="278" fill="#34D399" font-family="'Inter', sans-serif" font-weight="600" font-size="12">R$ 48,00 • Em estoque</text>
    <text x="34" y="296" fill="#94A3B8" font-family="'JetBrains Mono', monospace" font-size="10">📍 2.3 km (Itabaiana - SE)</text>

    <rect x="24" y="320" width="172" height="68" rx="8" fill="#162032" stroke="#1E293B" stroke-width="1"/>
    <text x="34" y="340" fill="#F8FAFC" font-family="'Inter', sans-serif" font-weight="600" font-size="12">Auto Moto Sergipe</text>
    <text x="34" y="356" fill="#34D399" font-family="'Inter', sans-serif" font-weight="600" font-size="12">R$ 52,00 • 3 un</text>
    <text x="34" y="374" fill="#94A3B8" font-family="'JetBrains Mono', monospace" font-size="10">📍 5.8 km</text>

    <!-- Map View -->
    <g transform="translate(220, 0)">
      <!-- Map Background Grid -->
      <rect width="580" height="408" fill="#0F172A"/>
      
      <!-- Roads lines -->
      <path d="M 0,180 Q 200,160 350,220 T 580,240" fill="none" stroke="#1E293B" stroke-width="16"/>
      <path d="M 0,180 Q 200,160 350,220 T 580,240" fill="none" stroke="#334155" stroke-width="8"/>
      
      <path d="M 280,0 L 280,408" fill="none" stroke="#1E293B" stroke-width="12"/>
      <path d="M 280,0 L 280,408" fill="none" stroke="#334155" stroke-width="6"/>

      <path d="M 120,408 Q 300,280 480,100" fill="none" stroke="#334155" stroke-width="4"/>

      <!-- Radius Circle (PostGIS) -->
      <circle cx="310" cy="210" r="140" fill="rgba(56, 189, 248, 0.08)" stroke="#38BDF8" stroke-width="2" stroke-dasharray="6,4"/>
      <circle cx="310" cy="210" r="8" fill="#38BDF8"/>
      <circle cx="310" cy="210" r="22" fill="none" stroke="#38BDF8" stroke-width="1.5" opacity="0.6"/>

      <!-- User Pin tooltip -->
      <rect x="250" y="165" width="120" height="28" rx="6" fill="#0B0F17" stroke="#38BDF8" stroke-width="1"/>
      <text x="310" y="183" fill="#F8FAFC" font-family="'Inter', sans-serif" font-size="11" text-anchor="middle">Sua Localização</text>

      <!-- Shop Pins -->
      <!-- Pin 1 -->
      <g transform="translate(390, 160)">
        <circle cx="0" cy="0" r="16" fill="url(#cyanGrad)"/>
        <text x="0" y="5" fill="#FFFFFF" font-family="'Inter', sans-serif" font-weight="700" font-size="12" text-anchor="middle">🏍️</text>
        <rect x="-60" y="-36" width="120" height="26" rx="5" fill="#0B0F17" stroke="#34D399" stroke-width="1"/>
        <text x="0" y="-19" fill="#34D399" font-family="'Inter', sans-serif" font-weight="600" font-size="10" text-anchor="middle">Moto Peças (R$48)</text>
      </g>

      <!-- Pin 2 -->
      <g transform="translate(240, 290)">
        <circle cx="0" cy="0" r="14" fill="#38BDF8"/>
        <text x="0" y="4" fill="#FFFFFF" font-family="'Inter', sans-serif" font-size="10" text-anchor="middle">🔧</text>
      </g>

      <!-- Pin 3 -->
      <g transform="translate(410, 270)">
        <circle cx="0" cy="0" r="14" fill="#38BDF8"/>
        <text x="0" y="4" fill="#FFFFFF" font-family="'Inter', sans-serif" font-size="10" text-anchor="middle">🔧</text>
      </g>

      <!-- PostGIS tech badge overlay -->
      <rect x="360" y="358" width="200" height="34" rx="6" fill="rgba(11, 15, 23, 0.9)" stroke="#38BDF8" stroke-width="1"/>
      <text x="460" y="379" fill="#38BDF8" font-family="'JetBrains Mono', monospace" font-size="11" text-anchor="middle">⚡ PostGIS ST_DWithin: 15km</text>
    </g>
    
  </g>
</svg>