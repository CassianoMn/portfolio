<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B0F17"/>
      <stop offset="100%" stop-color="#111827"/>
    </linearGradient>
    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="100%" stop-color="#0284C7"/>
    </linearGradient>
    <linearGradient id="emeraldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34D399"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
    <linearGradient id="purpleGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#C084FC"/>
      <stop offset="100%" stop-color="#7C3AED"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Frame Background -->
  <rect width="800" height="450" rx="14" fill="url(#bgGrad)" stroke="#1E293B" stroke-width="2"/>

  <!-- Window Header -->
  <rect width="800" height="42" rx="14" fill="#0F172A"/>
  <rect y="28" width="800" height="14" fill="#0F172A"/>
  <line x1="0" y1="42" x2="800" y2="42" stroke="#1E293B" stroke-width="1.5"/>

  <!-- Window Dots -->
  <circle cx="24" cy="21" r="5.5" fill="#EF4444"/>
  <circle cx="42" cy="21" r="5.5" fill="#F59E0B"/>
  <circle cx="60" cy="21" r="5.5" fill="#10B981"/>

  <!-- Address Bar -->
  <rect x="180" y="9" width="440" height="24" rx="6" fill="#1E293B" stroke="#334155" stroke-width="1"/>
  <text x="400" y="25" fill="#94A3B8" font-family="'JetBrains Mono', monospace" font-size="11" text-anchor="middle">
    🔒 https://cassianomn.github.io/Gobiraba
  </text>

  <!-- Tag Title on Right -->
  <text x="770" y="25" fill="#38BDF8" font-family="'Inter', sans-serif" font-weight="600" font-size="11" text-anchor="end">
    GobirabaSystem • Gestão Comercial
  </text>

  <!-- Body Content -->
  <g transform="translate(0, 42)">
    
    <rect width="800" height="408" fill="#0B0F17"/>

    <g transform="translate(30, 16)">
      <text x="0" y="20" fill="#F8FAFC" font-family="'Inter', sans-serif" font-weight="800" font-size="17">GobirabaSystem • Gestão de Estoque & Movimentações</text>
      <text x="0" y="38" fill="#94A3B8" font-family="'Inter', sans-serif" font-size="12">Aplicação web comercial modularizada em JavaScript ES6 puro e LocalStorage</text>

      <!-- Stat blocks -->
      <rect x="0" y="55" width="235" height="74" rx="8" fill="#111827" stroke="#1E293B" stroke-width="1"/>
      <text x="16" y="77" fill="#94A3B8" font-size="10">VALOR TOTAL DO ESTOQUE</text>
      <text x="16" y="105" fill="#38BDF8" font-family="'JetBrains Mono', monospace" font-weight="700" font-size="19">R$ 42.600,00</text>

      <rect x="252" y="55" width="235" height="74" rx="8" fill="#111827" stroke="#1E293B" stroke-width="1"/>
      <text x="268" y="77" fill="#94A3B8" font-size="10">PRODUTOS CADASTRADOS</text>
      <text x="268" y="105" fill="#34D399" font-family="'JetBrains Mono', monospace" font-weight="700" font-size="19">154 itens</text>

      <rect x="505" y="55" width="235" height="74" rx="8" fill="#111827" stroke="#1E293B" stroke-width="1"/>
      <text x="521" y="77" fill="#94A3B8" font-size="10">ALERTA REPOSIÇÃO</text>
      <text x="521" y="105" fill="#F87171" font-family="'JetBrains Mono', monospace" font-weight="700" font-size="19">3 produtos em baixa</text>

      <!-- Table Section -->
      <rect x="0" y="145" width="740" height="215" rx="10" fill="#111827" stroke="#1E293B" stroke-width="1"/>
      
      <!-- Table Header -->
      <rect x="15" y="160" width="710" height="30" fill="#1E293B" rx="4"/>
      <text x="30" y="180" fill="#94A3B8" font-family="'JetBrains Mono', monospace" font-size="11">CÓDIGO</text>
      <text x="140" y="180" fill="#94A3B8" font-family="'JetBrains Mono', monospace" font-size="11">DESCRIÇÃO DA MERCADORIA</text>
      <text x="420" y="180" fill="#94A3B8" font-family="'JetBrains Mono', monospace" font-size="11">ESTOQUE</text>
      <text x="530" y="180" fill="#94A3B8" font-family="'JetBrains Mono', monospace" font-size="11">PREÇO VENDA</text>
      <text x="650" y="180" fill="#94A3B8" font-family="'JetBrains Mono', monospace" font-size="11">STATUS</text>

      <!-- Row 1 -->
      <text x="30" y="214" fill="#94A3B8" font-family="'JetBrains Mono', monospace" font-size="11">#00142</text>
      <text x="140" y="214" fill="#F8FAFC" font-family="'Inter', sans-serif" font-weight="600" font-size="12">Cerveja Artesanal IPA 500ml</text>
      <text x="420" y="214" fill="#CBD5E1" font-family="'JetBrains Mono', monospace" font-size="12">84 un</text>
      <text x="530" y="214" fill="#34D399" font-family="'JetBrains Mono', monospace" font-weight="600" font-size="12">R$ 18,50</text>
      <text x="650" y="214" fill="#34D399" font-family="'JetBrains Mono', monospace" font-size="11">● Normal</text>

      <!-- Row 2 -->
      <line x1="15" y1="232" x2="725" y2="232" stroke="#1E293B"/>
      <text x="30" y="256" fill="#94A3B8" font-family="'JetBrains Mono', monospace" font-size="11">#00143</text>
      <text x="140" y="256" fill="#F8FAFC" font-family="'Inter', sans-serif" font-weight="600" font-size="12">Queijo Canastra Curado 1kg</text>
      <text x="420" y="256" fill="#CBD5E1" font-family="'JetBrains Mono', monospace" font-size="12">12 un</text>
      <text x="530" y="256" fill="#34D399" font-family="'JetBrains Mono', monospace" font-weight="600" font-size="12">R$ 68,00</text>
      <text x="650" y="256" fill="#F59E0B" font-family="'JetBrains Mono', monospace" font-size="11">● Atenção</text>

      <!-- Row 3 -->
      <line x1="15" y1="274" x2="725" y2="274" stroke="#1E293B"/>
      <text x="30" y="298" fill="#94A3B8" font-family="'JetBrains Mono', monospace" font-size="11">#00144</text>
      <text x="140" y="298" fill="#F8FAFC" font-family="'Inter', sans-serif" font-weight="600" font-size="12">Café Especial Torrado 250g</text>
      <text x="420" y="298" fill="#CBD5E1" font-family="'JetBrains Mono', monospace" font-size="12">4 un</text>
      <text x="530" y="298" fill="#34D399" font-family="'JetBrains Mono', monospace" font-weight="600" font-size="12">R$ 24,00</text>
      <text x="650" y="298" fill="#F87171" font-family="'JetBrains Mono', monospace" font-size="11">● Repor</text>

      <!-- Action Row -->
      <line x1="15" y1="316" x2="725" y2="316" stroke="#1E293B"/>
      <text x="30" y="342" fill="#38BDF8" font-family="'Inter', sans-serif" font-weight="600" font-size="11">+ Registrar Entrada de Mercadoria</text>
      <text x="630" y="342" fill="#94A3B8" font-family="'JetBrains Mono', monospace" font-size="10">Página 1 de 12 ›</text>
    </g>
    
  </g>
</svg>