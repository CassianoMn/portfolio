<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B0F17"/>
      <stop offset="100%" stop-color="#111827"/>
    </linearGradient>
    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="100%" stop-color="#0284C7"/>
    </linearGradient>
    <linearGradient id="emeraldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34D399"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
    <linearGradient id="purpleGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#C084FC"/>
      <stop offset="100%" stop-color="#7C3AED"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Frame Background -->
  <rect width="800" height="450" rx="14" fill="url(#bgGrad)" stroke="#1E293B" stroke-width="2"/>

  <!-- Window Header -->
  <rect width="800" height="42" rx="14" fill="#0F172A"/>
  <rect y="28" width="800" height="14" fill="#0F172A"/>
  <line x1="0" y1="42" x2="800" y2="42" stroke="#1E293B" stroke-width="1.5"/>

  <!-- Window Dots -->
  <circle cx="24" cy="21" r="5.5" fill="#EF4444"/>
  <circle cx="42" cy="21" r="5.5" fill="#F59E0B"/>
  <circle cx="60" cy="21" r="5.5" fill="#10B981"/>

  <!-- Address Bar -->
  <rect x="180" y="9" width="440" height="24" rx="6" fill="#1E293B" stroke="#334155" stroke-width="1"/>
  <text x="400" y="25" fill="#94A3B8" font-family="'JetBrains Mono', monospace" font-size="11" text-anchor="middle">
    🔒 https://github.com/CassianoMn/tees-2026-2-unidade-1
  </text>

  <!-- Tag Title on Right -->
  <text x="770" y="25" fill="#38BDF8" font-family="'Inter', sans-serif" font-weight="600" font-size="11" text-anchor="end">
    TEES • Arquitetura Hexagonal & Benchmark
  </text>

  <!-- Body Content -->
  <g transform="translate(0, 42)">
    
    <rect width="800" height="408" fill="#0B0F17"/>

    <g transform="translate(30, 16)">
      <text x="0" y="20" fill="#F8FAFC" font-family="'Inter', sans-serif" font-weight="800" font-size="17">Refatoração Hexagonal (Ports & Adapters) & Testes E2E</text>
      <text x="0" y="38" fill="#94A3B8" font-family="'Inter', sans-serif" font-size="12">Desacoplamento do domínio em C# .NET 8 e Estudo Comparativo de Protocolos (REST vs GraphQL)</text>

      <!-- Architecture Diagram Container -->
      <rect x="0" y="55" width="460" height="305" rx="10" fill="#111827" stroke="#38BDF8" stroke-width="1.5"/>
      <text x="20" y="82" fill="#38BDF8" font-family="'JetBrains Mono', monospace" font-weight="700" font-size="12">HEXAGONAL ARCHITECTURE CORE</text>

      <!-- Outer Ring (Driving / Primary Adapters) -->
      <rect x="20" y="100" width="120" height="60" rx="6" fill="#162032" stroke="#334155" stroke-width="1"/>
      <text x="80" y="125" fill="#F8FAFC" font-family="'Inter', sans-serif" font-weight="600" font-size="11" text-anchor="middle">Web MVC / API</text>
      <text x="80" y="142" fill="#38BDF8" font-family="'JetBrains Mono', monospace" font-size="9" text-anchor="middle">[Driving Adapter]</text>

      <rect x="20" y="180" width="120" height="60" rx="6" fill="#162032" stroke="#334155" stroke-width="1"/>
      <text x="80" y="205" fill="#F8FAFC" font-family="'Inter', sans-serif" font-weight="600" font-size="11" text-anchor="middle">GraphQL / REST</text>
      <text x="80" y="222" fill="#38BDF8" font-family="'JetBrains Mono', monospace" font-size="9" text-anchor="middle">[E2E Playwright]</text>

      <!-- Ports In/Out -->
      <line x1="140" y1="130" x2="180" y2="130" stroke="#38BDF8" stroke-width="2"/>
      <line x1="140" y1="210" x2="180" y2="210" stroke="#38BDF8" stroke-width="2"/>

      <!-- Inner Core Hexagon / Domain -->
      <polygon points="260,105 320,135 320,205 260,235 200,205 200,135" fill="rgba(56, 189, 248, 0.15)" stroke="#38BDF8" stroke-width="2"/>
      <text x="260" y="165" fill="#FFFFFF" font-family="'Inter', sans-serif" font-weight="800" font-size="12" text-anchor="middle">DOMAIN</text>
      <text x="260" y="182" fill="#38BDF8" font-family="'Inter', sans-serif" font-weight="700" font-size="11" text-anchor="middle">CORE</text>

      <!-- Driven Adapters (Persistence & DB) -->
      <line x1="320" y1="170" x2="360" y2="170" stroke="#34D399" stroke-width="2"/>
      <rect x="360" y="140" width="80" height="60" rx="6" fill="#162032" stroke="#34D399" stroke-width="1"/>
      <text x="400" y="165" fill="#34D399" font-family="'Inter', sans-serif" font-weight="700" font-size="11" text-anchor="middle">MySQL</text>
      <text x="400" y="182" fill="#94A3B8" font-family="'JetBrains Mono', monospace" font-size="9" text-anchor="middle">EF Core Repo</text>

      <rect x="20" y="270" width="420" height="70" rx="6" fill="#0B0F17" stroke="#1E293B" stroke-width="1"/>
      <text x="35" y="294" fill="#34D399" font-family="'Inter', sans-serif" font-weight="700" font-size="11">✓ Suíte de Testes Automatizados 100% Verde</text>
      <text x="35" y="312" fill="#CBD5E1" font-family="'JetBrains Mono', monospace" font-size="10">MSTest + Moq: 48 testes unitários de isolamento do domínio</text>
      <text x="35" y="328" fill="#CBD5E1" font-family="'JetBrains Mono', monospace" font-size="10">Playwright E2E: Verificação de ponta a ponta dos fluxos de compra</text>

      <!-- Right Benchmark Box -->
      <rect x="480" y="55" width="260" height="305" rx="10" fill="#111827" stroke="#1E293B" stroke-width="1"/>
      <text x="500" y="82" fill="#F8FAFC" font-family="'Inter', sans-serif" font-weight="700" font-size="13">Benchmark REST vs GraphQL</text>
      <text x="500" y="100" fill="#94A3B8" font-family="'Inter', sans-serif" font-size="11">Análise empírica de payload e latência</text>

      <!-- Metric 1 -->
      <rect x="500" y="118" width="220" height="60" rx="6" fill="#162032" stroke="#1E293B" stroke-width="1"/>
      <text x="515" y="138" fill="#94A3B8" font-size="10">PAYLOAD OVER-FETCHING</text>
      <text x="515" y="162" fill="#34D399" font-family="'JetBrains Mono', monospace" font-weight="700" font-size="15">-68% em GraphQL</text>

      <!-- Metric 2 -->
      <rect x="500" y="190" width="220" height="60" rx="6" fill="#162032" stroke="#1E293B" stroke-width="1"/>
      <text x="515" y="210" fill="#94A3B8" font-size="10">TEMPO MÉDIO RESPOSTA</text>
      <text x="515" y="234" fill="#38BDF8" font-family="'JetBrains Mono', monospace" font-weight="700" font-size="15">REST: 24ms | GQL: 28ms</text>

      <!-- Metric 3 -->
      <rect x="500" y="262" width="220" height="78" rx="6" fill="#162032" stroke="#1E293B" stroke-width="1"/>
      <text x="515" y="282" fill="#94A3B8" font-size="10">CONCLUSÃO DO ESTUDO</text>
      <text x="515" y="302" fill="#F8FAFC" font-family="'Inter', sans-serif" font-size="11">GraphQL ideal para dados</text>
      <text x="515" y="318" fill="#F8FAFC" font-family="'Inter', sans-serif" font-size="11">customizados; REST mais leve.</text>
    </g>
    
  </g>
</svg>