<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B0F17"/>
      <stop offset="100%" stop-color="#111827"/>
    </linearGradient>
    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="100%" stop-color="#0284C7"/>
    </linearGradient>
    <linearGradient id="emeraldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34D399"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
    <linearGradient id="purpleGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#C084FC"/>
      <stop offset="100%" stop-color="#7C3AED"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Frame Background -->
  <rect width="800" height="450" rx="14" fill="url(#bgGrad)" stroke="#1E293B" stroke-width="2"/>

  <!-- Window Header -->
  <rect width="800" height="42" rx="14" fill="#0F172A"/>
  <rect y="28" width="800" height="14" fill="#0F172A"/>
  <line x1="0" y1="42" x2="800" y2="42" stroke="#1E293B" stroke-width="1.5"/>

  <!-- Window Dots -->
  <circle cx="24" cy="21" r="5.5" fill="#EF4444"/>
  <circle cx="42" cy="21" r="5.5" fill="#F59E0B"/>
  <circle cx="60" cy="21" r="5.5" fill="#10B981"/>

  <!-- Address Bar -->
  <rect x="180" y="9" width="440" height="24" rx="6" fill="#1E293B" stroke="#334155" stroke-width="1"/>
  <text x="400" y="25" fill="#94A3B8" font-family="'JetBrains Mono', monospace" font-size="11" text-anchor="middle">
    🔒 https://desktop.app/java-swing/weekly-planner
  </text>

  <!-- Tag Title on Right -->
  <text x="770" y="25" fill="#38BDF8" font-family="'Inter', sans-serif" font-weight="600" font-size="11" text-anchor="end">
    Gerenciador de Tarefas • Java Swing GUI
  </text>

  <!-- Body Content -->
  <g transform="translate(0, 42)">
    
    <rect width="800" height="408" fill="#0B0F17"/>

    <g transform="translate(30, 16)">
      <text x="0" y="20" fill="#F8FAFC" font-family="'Inter', sans-serif" font-weight="800" font-size="17">Gerenciador de Tarefas Semanais • Interface Java Swing</text>
      <text x="0" y="38" fill="#94A3B8" font-family="'Inter', sans-serif" font-size="12">Aplicação desktop com POO rigorosa (Encapsulamento, Herança e Polimorfismo)</text>

      <!-- Window Java Frame Look -->
      <rect x="0" y="55" width="740" height="305" rx="8" fill="#1E293B" stroke="#475569" stroke-width="2"/>
      
      <!-- Java Menu Bar -->
      <rect x="0" y="55" width="740" height="26" fill="#334155"/>
      <text x="16" y="72" fill="#F8FAFC" font-family="'Inter', sans-serif" font-size="11">Arquivo   Editar   Exibir   Ajuda</text>
      
      <!-- Day Columns -->
      <!-- Seg -->
      <rect x="15" y="92" width="135" height="250" rx="6" fill="#0F172A" stroke="#334155" stroke-width="1"/>
      <text x="82" y="115" fill="#38BDF8" font-family="'Inter', sans-serif" font-weight="700" font-size="12" text-anchor="middle">Segunda-feira</text>
      <rect x="25" y="130" width="115" height="42" rx="4" fill="#162032"/>
      <text x="32" y="148" fill="#34D399" font-size="10">✓ Reunião Sprint</text>
      <text x="32" y="162" fill="#94A3B8" font-size="9">+10 pts</text>
      <rect x="25" y="180" width="115" height="42" rx="4" fill="#162032"/>
      <text x="32" y="198" fill="#34D399" font-size="10">✓ Estudo C#/.NET</text>
      <text x="32" y="212" fill="#94A3B8" font-size="9">+15 pts</text>

      <!-- Ter -->
      <rect x="160" y="92" width="135" height="250" rx="6" fill="#0F172A" stroke="#334155" stroke-width="1"/>
      <text x="227" y="115" fill="#38BDF8" font-family="'Inter', sans-serif" font-weight="700" font-size="12" text-anchor="middle">Terça-feira</text>
      <rect x="170" y="130" width="115" height="42" rx="4" fill="#162032"/>
      <text x="177" y="148" fill="#34D399" font-size="10">✓ Refatoração API</text>
      <text x="177" y="162" fill="#94A3B8" font-size="9">+20 pts</text>
      <rect x="170" y="180" width="115" height="42" rx="4" fill="#162032"/>
      <text x="177" y="198" fill="#F8FAFC" font-size="10">☐ Escrever Testes</text>
      <text x="177" y="212" fill="#94A3B8" font-size="9">Pendente</text>

      <!-- Qua -->
      <rect x="305" y="92" width="135" height="250" rx="6" fill="#0F172A" stroke="#334155" stroke-width="1"/>
      <text x="372" y="115" fill="#38BDF8" font-family="'Inter', sans-serif" font-weight="700" font-size="12" text-anchor="middle">Quarta-feira</text>
      <rect x="315" y="130" width="115" height="42" rx="4" fill="#162032"/>
      <text x="322" y="148" fill="#34D399" font-size="10">✓ Code Review PR</text>
      <text x="322" y="162" fill="#94A3B8" font-size="9">+15 pts</text>

      <!-- Qui -->
      <rect x="450" y="92" width="135" height="250" rx="6" fill="#0F172A" stroke="#334155" stroke-width="1"/>
      <text x="517" y="115" fill="#38BDF8" font-family="'Inter', sans-serif" font-weight="700" font-size="12" text-anchor="middle">Quinta-feira</text>
      <rect x="460" y="130" width="115" height="42" rx="4" fill="#162032"/>
      <text x="467" y="148" fill="#F8FAFC" font-size="10">☐ Deploy Staging</text>
      <text x="467" y="162" fill="#94A3B8" font-size="9">Pendente</text>

      <!-- Sex -->
      <rect x="595" y="92" width="130" height="250" rx="6" fill="#0F172A" stroke="#334155" stroke-width="1"/>
      <text x="660" y="115" fill="#38BDF8" font-family="'Inter', sans-serif" font-weight="700" font-size="12" text-anchor="middle">Sexta-feira</text>
      <rect x="605" y="130" width="110" height="42" rx="4" fill="#162032"/>
      <text x="612" y="148" fill="#F8FAFC" font-size="10">☐ Retro & Demo</text>
      <text x="612" y="162" fill="#94A3B8" font-size="9">Pendente</text>
    </g>
    
  </g>
</svg>