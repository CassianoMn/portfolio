      <text x="24" y="32" fill="#C084FC" font-family="'JetBrains Mono', monospace" font-weight="700" font-size="11">PAINEL DO GESTOR • ASP.NET CORE MVC (.NET 8)</text>
      <text x="24" y="58" fill="#F8FAFC" font-family="'Inter', sans-serif" font-weight="800" font-size="18">Simpósio de Tecnologia e Inovação 2026</text>
      
      <rect x="560" y="22" width="156" height="36" rx="6" fill="#7C3AED"/>
      <text x="638" y="45" fill="#FFFFFF" font-family="'Inter', sans-serif" font-weight="600" font-size="12" text-anchor="middle">+ Novo Lote</text>

      <!-- Stats Cards -->
      <rect x="0" y="96" width="170" height="64" rx="8" fill="#111827" stroke="#1E293B" stroke-width="1"/>
      <text x="16" y="118" fill="#94A3B8" font-size="10">TOTAL INSCRITOS</text>
      <text x="16" y="144" fill="#C084FC" font-family="'JetBrains Mono', monospace" font-weight="700" font-size="18">480 / 500</text>

      <rect x="190" y="96" width="170" height="64" rx="8" fill="#111827" stroke="#1E293B" stroke-width="1"/>
      <text x="206" y="118" fill="#94A3B8" font-size="10">CREDENCIADOS</text>
      <text x="206" y="144" fill="#34D399" font-family="'JetBrains Mono', monospace" font-weight="700" font-size="18">392 presentes</text>

      <rect x="380" y="96" width="170" height="64" rx="8" fill="#111827" stroke="#1E293B" stroke-width="1"/>
      <text x="396" y="118" fill="#94A3B8" font-size="10">SUBEVENTOS ATIVOS</text>
      <text x="396" y="144" fill="#38BDF8" font-family="'JetBrains Mono', monospace" font-weight="700" font-size="18">6 Workshops</text>

      <rect x="570" y="96" width="170" height="64" rx="8" fill="#111827" stroke="#1E293B" stroke-width="1"/>
      <text x="586" y="118" fill="#94A3B8" font-size="10">CERTIFICADOS EMITIDOS</text>
      <text x="586" y="144" fill="#F59E0B" font-family="'JetBrains Mono', monospace" font-weight="700" font-size="18">340 emitidos</text>

      <!-- Table Section -->
      <rect x="0" y="174" width="740" height="195" rx="10" fill="#111827" stroke="#1E293B" stroke-width="1"/>
      <text x="20" y="200" fill="#F8FAFC" font-family="'Inter', sans-serif" font-weight="700" font-size="13">Participantes & Controle de Presença (MySQL Transacional)</text>

      <!-- Table Header -->
      <rect x="20" y="214" width="700" height="28" fill="#1E293B" rx="4"/>
      <text x="30" y="232" fill="#94A3B8" font-family="'JetBrains Mono', monospace" font-size="11">NOME</text>
      <text x="240" y="232" fill="#94A3B8" font-family="'JetBrains Mono', monospace" font-size="11">TIPO INSCRIÇÃO</text>
      <text x="400" y="232" fill="#94A3B8" font-family="'JetBrains Mono', monospace" font-size="11">STATUS</text>
      <text x="530" y="232" fill="#94A3B8" font-family="'JetBrains Mono', monospace" font-size="11">FREQUÊNCIA</text>
      <text x="660" y="232" fill="#94A3B8" font-family="'JetBrains Mono', monospace" font-size="11">AÇÃO</text>

      <!-- Row 1 -->
      <text x="30" y="266" fill="#F8FAFC" font-family="'Inter', sans-serif" font-size="12">Cassiano Menezes</text>
      <text x="240" y="266" fill="#CBD5E1" font-family="'Inter', sans-serif" font-size="12">Estudante (UFS)</text>
      <text x="400" y="266" fill="#34D399" font-family="'JetBrains Mono', monospace" font-size="11">✓ ATIVA</text>
      <text x="530" y="266" fill="#38BDF8" font-family="'JetBrains Mono', monospace" font-size="11">100% (2/2 dias)</text>
      <text x="660" y="266" fill="#C084FC" font-family="'Inter', sans-serif" font-weight="600" font-size="11">Crachá [Q]</text>

      <!-- Row 2 -->
      <line x1="20" y1="284" x2="720" y2="284" stroke="#1E293B"/>
      <text x="30" y="306" fill="#F8FAFC" font-family="'Inter', sans-serif" font-size="12">Marcos Vinicius Sodré</text>
      <text x="240" y="306" fill="#CBD5E1" font-family="'Inter', sans-serif" font-size="12">Profissional TI</text>
      <text x="400" y="306" fill="#34D399" font-family="'JetBrains Mono', monospace" font-size="11">✓ ATIVA</text>
      <text x="530" y="306" fill="#38BDF8" font-family="'JetBrains Mono', monospace" font-size="11">85% (Presente)</text>
      <text x="660" y="306" fill="#C084FC" font-family="'Inter', sans-serif" font-weight="600" font-size="11">Crachá [Q]</text>

      <!-- Row 3 -->
      <line x1="20" y1="324" x2="720" y2="324" stroke="#1E293B"/>
      <text x="30" y="346" fill="#F8FAFC" font-family="'Inter', sans-serif" font-size="12">Beatriz Santana</text>
      <text x="240" y="346" fill="#CBD5E1" font-family="'Inter', sans-serif" font-size="12">Pesquisadora</text>
      <text x="400" y="346" fill="#34D399" font-family="'JetBrains Mono', monospace" font-size="11">✓ ATIVA</text>
      <text x="530" y="346" fill="#38BDF8" font-family="'JetBrains Mono', monospace" font-size="11">100% (Presente)</text>
      <text x="660" y="346" fill="#C084FC" font-family="'Inter', sans-serif" font-weight="600" font-size="11">Crachá [Q]</text>
    </g>
    
  </g>
</svg>