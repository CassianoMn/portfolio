      <text x="392" y="146" fill="#F8FAFC" font-family="'Inter', sans-serif" font-size="12">Supermercado Sergipe Ltda</text>

      <text x="380" y="176" fill="#94A3B8" font-family="'Inter', sans-serif" font-size="11">VALOR TOTAL EXTRAÍDO</text>
