      <text x="170" y="125" fill="#0F172A" font-family="'JetBrains Mono', monospace" font-weight="700" font-size="11" text-anchor="middle">SUPERMERCADO SERGIPE LTDA</text>
      <text x="170" y="140" fill="#64748B" font-family="'JetBrains Mono', monospace" font-size="9" text-anchor="middle">CNPJ: 12.345.678/0001-90</text>
      <line x1="60" y1="150" x2="280" y2="150" stroke="#CBD5E1" stroke-dasharray="3,3"/>
      
      <text x="65" y="170" fill="#0F172A" font-family="'JetBrains Mono', monospace" font-size="10">CAFÉ GOURMET 500G</text>
      <text x="275" y="170" fill="#0F172A" font-family="'JetBrains Mono', monospace" font-size="10" text-anchor="end">R$ 18,90</text>
      
      <text x="65" y="190" fill="#0F172A" font-family="'JetBrains Mono', monospace" font-size="10">AZEITE EXTRA VIRGEM</text>
      <text x="275" y="190" fill="#0F172A" font-family="'JetBrains Mono', monospace" font-size="10" text-anchor="end">R$ 34,50</text>
      
      <text x="65" y="210" fill="#0F172A" font-family="'JetBrains Mono', monospace" font-size="10">LEITE INTEGRAL 1L (x2)</text>
      <text x="275" y="210" fill="#0F172A" font-family="'JetBrains Mono', monospace" font-size="10" text-anchor="end">R$ 11,80</text>
      
      <line x1="60" y1="230" x2="280" y2="230" stroke="#0F172A" stroke-width="1"/>
      <text x="65" y="250" fill="#0F172A" font-family="'JetBrains Mono', monospace" font-weight="700" font-size="11">TOTAL CUPOM</text>
      <text x="275" y="250" fill="#059669" font-family="'JetBrains Mono', monospace" font-weight="700" font-size="12" text-anchor="end">R$ 65,20</text>

      <!-- Right Column: AI Extraction & Result Form -->
      <rect x="360" y="55" width="360" height="305" rx="10" fill="#111827" stroke="#38BDF8" stroke-width="1.5"/>
      <rect x="380" y="70" width="130" height="24" rx="4" fill="rgba(56, 189, 248, 0.15)"/>
      <text x="445" y="86" fill="#38BDF8" font-family="'Inter', sans-serif" font-weight="700" font-size="11" text-anchor="middle">✨ Gemini 1.5 Flash</text>

      <text x="380" y="118" fill="#94A3B8" font-family="'Inter', sans-serif" font-size="11">ESTABELECIMENTO IDENTIFICADO</text>
