<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B0F17"/>
      <stop offset="100%" stop-color="#111827"/>
    </linearGradient>
    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="100%" stop-color="#0284C7"/>
    </linearGradient>
    <linearGradient id="emeraldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34D399"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
    <linearGradient id="purpleGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#C084FC"/>
      <stop offset="100%" stop-color="#7C3AED"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Frame Background -->
  <rect width="800" height="450" rx="14" fill="url(#bgGrad)" stroke="#1E293B" stroke-width="2"/>

  <!-- Window Header -->
  <rect width="800" height="42" rx="14" fill="#0F172A"/>
  <rect y="28" width="800" height="14" fill="#0F172A"/>
  <line x1="0" y1="42" x2="800" y2="42" stroke="#1E293B" stroke-width="1.5"/>

  <!-- Window Dots -->
  <circle cx="24" cy="21" r="5.5" fill="#EF4444"/>
  <circle cx="42" cy="21" r="5.5" fill="#F59E0B"/>
  <circle cx="60" cy="21" r="5.5" fill="#10B981"/>

  <!-- Address Bar -->
  <rect x="180" y="9" width="440" height="24" rx="6" fill="#1E293B" stroke="#334155" stroke-width="1"/>
  <text x="400" y="25" fill="#94A3B8" font-family="'JetBrains Mono', monospace" font-size="11" text-anchor="middle">
    🔒 https://radarpecas.app/pecas/compatibilidade
  </text>

  <!-- Tag Title on Right -->
  <text x="770" y="25" fill="#38BDF8" font-family="'Inter', sans-serif" font-weight="600" font-size="11" text-anchor="end">
    RadarPeças • Catálogo & Compatibilidade
  </text>

  <!-- Body Content -->
  <g transform="translate(0, 42)">
    
    <rect width="800" height="408" fill="#0B0F17"/>
    
    <!-- Header inside page -->
    <text x="40" y="40" fill="#F8FAFC" font-family="'Inter', sans-serif" font-weight="700" font-size="18">Catálogo de Peças e Compatibilidade Técnica</text>
    <text x="40" y="60" fill="#94A3B8" font-family="'Inter', sans-serif" font-size="12">Filtragem estruturada via ASP.NET Core (.NET 8) + PostgreSQL</text>

    <!-- Search Bar -->
    <rect x="40" y="78" width="520" height="38" rx="8" fill="#162032" stroke="#334155" stroke-width="1"/>
    <text x="56" y="102" fill="#F8FAFC" font-family="'Inter', sans-serif" font-size="13">Pastilha de Freio Dianteira - Cobreq Street</text>
    <rect x="580" y="78" width="180" height="38" rx="8" fill="url(#cyanGrad)"/>
    <text x="670" y="102" fill="#FFFFFF" font-family="'Inter', sans-serif" font-weight="600" font-size="13" text-anchor="middle">Verificar Modelo</text>

    <!-- Compatibility banner -->
    <rect x="40" y="132" width="720" height="54" rx="8" fill="rgba(16, 185, 129, 0.1)" stroke="#10B981" stroke-width="1"/>
    <text x="60" y="155" fill="#34D399" font-family="'Inter', sans-serif" font-weight="700" font-size="13">✓ 100% Compatível com sua Honda CG 160 (2018 - 2024)</text>
    <text x="60" y="173" fill="#94A3B8" font-family="'JetBrains Mono', monospace" font-size="11">Especificação OEM verificada: Diâmetro 110mm • Código Peça: CBQ-4091</text>

    <!-- Grid of offers -->
    <!-- Card 1 -->
    <rect x="40" y="204" width="226" height="180" rx="10" fill="#111827" stroke="#38BDF8" stroke-width="1.5"/>
    <rect x="56" y="220" width="194" height="70" rx="6" fill="#1E293B"/>
    <text x="153" y="260" fill="#38BDF8" font-family="'Inter', sans-serif" font-size="28" text-anchor="middle">🏍️</text>
    <text x="56" y="310" fill="#F8FAFC" font-family="'Inter', sans-serif" font-weight="700" font-size="14">Cobreq Street N-943</text>
    <text x="56" y="330" fill="#34D399" font-family="'Inter', sans-serif" font-weight="700" font-size="16">R$ 48,00</text>
    <text x="56" y="348" fill="#94A3B8" font-family="'Inter', sans-serif" font-size="11">Oficina Central • 2.3km</text>
    <rect x="56" y="358" width="194" height="20" rx="4" fill="#0284C7"/>
    <text x="153" y="372" fill="#FFFFFF" font-family="'Inter', sans-serif" font-weight="600" font-size="10" text-anchor="middle">Reservar Agora</text>

    <!-- Card 2 -->
    <rect x="286" y="204" width="226" height="180" rx="10" fill="#111827" stroke="#1E293B" stroke-width="1"/>
    <rect x="302" y="220" width="194" height="70" rx="6" fill="#1E293B"/>
    <text x="399" y="260" fill="#94A3B8" font-family="'Inter', sans-serif" font-size="28" text-anchor="middle">⚙️</text>
    <text x="302" y="310" fill="#F8FAFC" font-family="'Inter', sans-serif" font-weight="700" font-size="14">Fras-le PD/78</text>
    <text x="302" y="330" fill="#34D399" font-family="'Inter', sans-serif" font-weight="700" font-size="16">R$ 55,00</text>
    <text x="302" y="348" fill="#94A3B8" font-family="'Inter', sans-serif" font-size="11">Motosul • 4.1km</text>
    <rect x="302" y="358" width="194" height="20" rx="4" fill="#1E293B"/>
    <text x="399" y="372" fill="#94A3B8" font-family="'Inter', sans-serif" font-weight="600" font-size="10" text-anchor="middle">Ver Detalhes</text>

    <!-- Card 3 -->
    <rect x="532" y="204" width="226" height="180" rx="10" fill="#111827" stroke="#1E293B" stroke-width="1"/>
    <rect x="548" y="220" width="194" height="70" rx="6" fill="#1E293B"/>
    <text x="645" y="260" fill="#94A3B8" font-family="'Inter', sans-serif" font-size="28" text-anchor="middle">🔩</text>
    <text x="548" y="310" fill="#F8FAFC" font-family="'Inter', sans-serif" font-weight="700" font-size="14">Fischer Carbon Series</text>
    <text x="548" y="330" fill="#34D399" font-family="'Inter', sans-serif" font-weight="700" font-size="16">R$ 62,90</text>
    <text x="548" y="348" fill="#94A3B8" font-family="'Inter', sans-serif" font-size="11">Itabaiana Racing • 6.0km</text>
    <rect x="548" y="358" width="194" height="20" rx="4" fill="#1E293B"/>
    <text x="645" y="372" fill="#94A3B8" font-family="'Inter', sans-serif" font-weight="600" font-size="10" text-anchor="middle">Ver Detalhes</text>
    
  </g>
</svg>