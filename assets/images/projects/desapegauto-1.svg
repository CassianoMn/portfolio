<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B0F17"/>
      <stop offset="100%" stop-color="#111827"/>
    </linearGradient>
    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="100%" stop-color="#0284C7"/>
    </linearGradient>
    <linearGradient id="emeraldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34D399"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
    <linearGradient id="purpleGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#C084FC"/>
      <stop offset="100%" stop-color="#7C3AED"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Frame Background -->
  <rect width="800" height="450" rx="14" fill="url(#bgGrad)" stroke="#1E293B" stroke-width="2"/>

  <!-- Window Header -->
  <rect width="800" height="42" rx="14" fill="#0F172A"/>
  <rect y="28" width="800" height="14" fill="#0F172A"/>
  <line x1="0" y1="42" x2="800" y2="42" stroke="#1E293B" stroke-width="1.5"/>

  <!-- Window Dots -->
  <circle cx="24" cy="21" r="5.5" fill="#EF4444"/>
  <circle cx="42" cy="21" r="5.5" fill="#F59E0B"/>
  <circle cx="60" cy="21" r="5.5" fill="#10B981"/>

  <!-- Address Bar -->
  <rect x="180" y="9" width="440" height="24" rx="6" fill="#1E293B" stroke="#334155" stroke-width="1"/>
  <text x="400" y="25" fill="#94A3B8" font-family="'JetBrains Mono', monospace" font-size="11" text-anchor="middle">
    🔒 https://desapegauto.app/catalogo
  </text>

  <!-- Tag Title on Right -->
  <text x="770" y="25" fill="#38BDF8" font-family="'Inter', sans-serif" font-weight="600" font-size="11" text-anchor="end">
    DesapegAuto • Plataforma Web de Veículos
  </text>

  <!-- Body Content -->
  <g transform="translate(0, 42)">
    
    <rect width="800" height="408" fill="#0B0F17"/>

    <g transform="translate(30, 16)">
      <!-- Top Bar -->
      <text x="0" y="20" fill="#F8FAFC" font-family="'Inter', sans-serif" font-weight="800" font-size="17">DesapegAuto • Estoque e Compra de Veículos</text>
      <text x="0" y="38" fill="#94A3B8" font-family="'Inter', sans-serif" font-size="12">ASP.NET Core MVC original com Razor Views, EF Core e MySQL</text>

      <!-- Search & Filters -->
      <rect x="0" y="55" width="740" height="44" rx="8" fill="#162032" stroke="#1E293B" stroke-width="1"/>
      <text x="20" y="82" fill="#94A3B8" font-family="'Inter', sans-serif" font-size="12">Marca: Toyota | Honda | VW</text>
      <text x="240" y="82" fill="#94A3B8" font-family="'Inter', sans-serif" font-size="12">Ano: 2020 a 2026</text>
      <text x="440" y="82" fill="#94A3B8" font-family="'Inter', sans-serif" font-size="12">Preço máx: R$ 120.000</text>
      <rect x="620" y="61" width="105" height="32" rx="6" fill="#0284C7"/>
      <text x="672" y="81" fill="#FFFFFF" font-family="'Inter', sans-serif" font-weight="600" font-size="12" text-anchor="middle">Filtrar</text>

      <!-- Vehicle Grid -->
      <!-- Car 1 -->
      <rect x="0" y="115" width="235" height="245" rx="10" fill="#111827" stroke="#38BDF8" stroke-width="1.5"/>
      <rect x="15" y="130" width="205" height="110" rx="6" fill="#1E293B"/>
      <text x="117" y="195" fill="#38BDF8" font-size="36" text-anchor="middle">🚗</text>
      <text x="15" y="260" fill="#F8FAFC" font-family="'Inter', sans-serif" font-weight="700" font-size="14">Toyota Corolla 2.0 XEi</text>
      <text x="15" y="278" fill="#94A3B8" font-family="'Inter', sans-serif" font-size="11">2023 • 32.000 km • Automático</text>
      <text x="15" y="304" fill="#34D399" font-family="'JetBrains Mono', monospace" font-weight="700" font-size="16">R$ 138.900</text>
      <rect x="15" y="318" width="205" height="26" rx="4" fill="#0284C7"/>
      <text x="117" y="335" fill="#FFFFFF" font-family="'Inter', sans-serif" font-weight="600" font-size="11" text-anchor="middle">Negociar Proposta</text>

      <!-- Car 2 -->
      <rect x="252" y="115" width="235" height="245" rx="10" fill="#111827" stroke="#1E293B" stroke-width="1"/>
      <rect x="267" y="130" width="205" height="110" rx="6" fill="#1E293B"/>
      <text x="369" y="195" fill="#94A3B8" font-size="36" text-anchor="middle">🚙</text>
      <text x="267" y="260" fill="#F8FAFC" font-family="'Inter', sans-serif" font-weight="700" font-size="14">Honda HR-V 1.5 Turbo</text>
      <text x="267" y="278" fill="#94A3B8" font-family="'Inter', sans-serif" font-size="11">2022 • 45.000 km • Flex</text>
      <text x="267" y="304" fill="#34D399" font-family="'JetBrains Mono', monospace" font-weight="700" font-size="16">R$ 119.500</text>
      <rect x="267" y="318" width="205" height="26" rx="4" fill="#1E293B"/>
      <text x="369" y="335" fill="#94A3B8" font-family="'Inter', sans-serif" font-weight="600" font-size="11" text-anchor="middle">Ver Detalhes</text>

      <!-- Car 3 -->
      <rect x="505" y="115" width="235" height="245" rx="10" fill="#111827" stroke="#1E293B" stroke-width="1"/>
      <rect x="520" y="130" width="205" height="110" rx="6" fill="#1E293B"/>
      <text x="622" y="195" fill="#94A3B8" font-size="36" text-anchor="middle">🏎️</text>
      <text x="520" y="260" fill="#F8FAFC" font-family="'Inter', sans-serif" font-weight="700" font-size="14">VW Golf GTE Híbrido</text>
      <text x="520" y="278" fill="#94A3B8" font-family="'Inter', sans-serif" font-size="11">2021 • 28.000 km • DSG</text>
      <text x="520" y="304" fill="#34D399" font-family="'JetBrains Mono', monospace" font-weight="700" font-size="16">R$ 145.000</text>
      <rect x="520" y="318" width="205" height="26" rx="4" fill="#1E293B"/>
      <text x="622" y="335" fill="#94A3B8" font-family="'Inter', sans-serif" font-weight="600" font-size="11" text-anchor="middle">Ver Detalhes</text>
    </g>
    
  </g>
</svg>