<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B0F17"/>
      <stop offset="100%" stop-color="#111827"/>
    </linearGradient>
    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="100%" stop-color="#0284C7"/>
    </linearGradient>
    <linearGradient id="emeraldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34D399"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
    <linearGradient id="purpleGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#C084FC"/>
      <stop offset="100%" stop-color="#7C3AED"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Frame Background -->
  <rect width="800" height="450" rx="14" fill="url(#bgGrad)" stroke="#1E293B" stroke-width="2"/>

  <!-- Window Header -->
  <rect width="800" height="42" rx="14" fill="#0F172A"/>
  <rect y="28" width="800" height="14" fill="#0F172A"/>
  <line x1="0" y1="42" x2="800" y2="42" stroke="#1E293B" stroke-width="1.5"/>

  <!-- Window Dots -->
  <circle cx="24" cy="21" r="5.5" fill="#EF4444"/>
  <circle cx="42" cy="21" r="5.5" fill="#F59E0B"/>
  <circle cx="60" cy="21" r="5.5" fill="#10B981"/>

  <!-- Address Bar -->
  <rect x="180" y="9" width="440" height="24" rx="6" fill="#1E293B" stroke="#334155" stroke-width="1"/>
  <text x="400" y="25" fill="#94A3B8" font-family="'JetBrains Mono', monospace" font-size="11" text-anchor="middle">
    🔒 https://cassianomn.github.io/Gobiraba/relatorios
  </text>

  <!-- Tag Title on Right -->
  <text x="770" y="25" fill="#38BDF8" font-family="'Inter', sans-serif" font-weight="600" font-size="11" text-anchor="end">
    GobirabaSystem • Relatório Financeiro
  </text>

  <!-- Body Content -->
  <g transform="translate(0, 42)">
    
    <rect width="800" height="408" fill="#0B0F17"/>

    <g transform="translate(30, 16)">
      <text x="0" y="20" fill="#F8FAFC" font-family="'Inter', sans-serif" font-weight="800" font-size="17">Relatório de Vendas e Margem de Lucro</text>
      <text x="0" y="38" fill="#94A3B8" font-family="'Inter', sans-serif" font-size="12">Cálculos automáticos em tempo real sem dependências externas</text>

      <!-- Top Row -->
      <rect x="0" y="55" width="355" height="135" rx="10" fill="#111827" stroke="#10B981" stroke-width="1.5"/>
      <text x="24" y="85" fill="#34D399" font-family="'Inter', sans-serif" font-weight="700" font-size="13">FATURAMENTO DO DIA</text>
      <text x="24" y="130" fill="#F8FAFC" font-family="'JetBrains Mono', monospace" font-weight="800" font-size="28">R$ 3.840,50</text>
      <text x="24" y="160" fill="#94A3B8" font-size="11">Total de 42 pedidos finalizados</text>

      <rect x="385" y="55" width="355" height="135" rx="10" fill="#111827" stroke="#38BDF8" stroke-width="1.5"/>
      <text x="409" y="85" fill="#38BDF8" font-family="'Inter', sans-serif" font-weight="700" font-size="13">LUCRO BRUTO ESTIMADO</text>
      <text x="409" y="130" fill="#38BDF8" font-family="'JetBrains Mono', monospace" font-weight="800" font-size="28">R$ 1.536,20</text>
      <text x="409" y="160" fill="#34D399" font-family="'JetBrains Mono', monospace" font-size="11">Margem média de lucro: 40.0%</text>

      <!-- Bottom Summary Box -->
      <rect x="0" y="210" width="740" height="150" rx="10" fill="#111827" stroke="#1E293B" stroke-width="1"/>
      <text x="24" y="240" fill="#F8FAFC" font-family="'Inter', sans-serif" font-weight="700" font-size="13">Desempenho Comercial por Período</text>

      <!-- Simple visual bars -->
      <g transform="translate(24, 260)">
        <text x="0" y="14" fill="#94A3B8" font-size="11">Manhã</text>
        <rect x="70" y="2" width="220" height="16" rx="4" fill="#0284C7"/>
        <text x="300" y="14" fill="#F8FAFC" font-family="'JetBrains Mono', monospace" font-size="11">R$ 1.250 (32%)</text>

        <text x="0" y="44" fill="#94A3B8" font-size="11">Tarde</text>
        <rect x="70" y="32" width="340" height="16" rx="4" fill="#10B981"/>
        <text x="420" y="44" fill="#F8FAFC" font-family="'JetBrains Mono', monospace" font-size="11">R$ 1.980 (52%)</text>

        <text x="0" y="74" fill="#94A3B8" font-size="11">Noite</text>
        <rect x="70" y="62" width="110" height="16" rx="4" fill="#A855F7"/>
        <text x="190" y="74" fill="#F8FAFC" font-family="'JetBrains Mono', monospace" font-size="11">R$ 610 (16%)</text>
      </g>
    </g>
    
  </g>
</svg>