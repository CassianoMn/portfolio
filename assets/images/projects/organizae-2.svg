      <text x="392" y="204" fill="#34D399" font-family="'JetBrains Mono', monospace" font-weight="700" font-size="13">R$ 65,20 (Confiança: 99.4%)</text>

      <text x="380" y="234" fill="#94A3B8" font-family="'Inter', sans-serif" font-size="11">CATEGORIA SUGERIDA PELA IA</text>
      <rect x="380" y="242" width="320" height="30" rx="6" fill="#162032" stroke="#334155" stroke-width="1"/>
      <text x="392" y="262" fill="#F8FAFC" font-family="'Inter', sans-serif" font-size="12">🛒 Alimentação & Supermercado</text>

      <!-- Save Button -->
